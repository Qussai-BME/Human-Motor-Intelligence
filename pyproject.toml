[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-motor-intelligence"
version = "0.1.0"
description = "Thin, local-first research integration infrastructure for biosignal-to-control studies."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Qussai Adlbi"},
]
keywords = ["biosignal", "emg", "eeg", "reproducibility", "benchmarking", "prosthetics", "research-infrastructure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
]
scientific = [
  "numpy>=1.26,<3.0",
  "matplotlib>=3.8,<4.0",
]

[project.scripts]
hmi = "research_core.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "integration: tests requiring an optional external repository runtime",
  "real_data: tests requiring externally acquired licensed data",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
