  cv: grouped_by_subject_5fold
  confidence_variants: [raw, platt_train_subjects_only]
  v1_gate: {best_zero_calibration_BA_min: 0.58, lower_exact_ci_gt: 0.55, best_vs_worst_cluster_bootstrap_ci_excludes_zero: true}
sensitivity: {confidence_threshold: [0.60, 0.70, 0.75, 0.85], confirmation_windows: [1, 2, 3, 5], q: [0.6, 0.7, 0.8, 0.9], episodes_per_cell: 200}
hypotheses: [H-E1, H-E2, H-E3, H-E4, H-R1]
multiplicity: holm
